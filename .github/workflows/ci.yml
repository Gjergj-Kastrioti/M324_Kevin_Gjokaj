name: M324 CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  validate-code:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Task2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          # Important: Tell the cache step where the lock file is too
          cache-dependency-path: ./Task2/package-lock.json 

      - name: Install dependencies
        run: npm ci 
        # Thanks to 'defaults' above, this now runs in ./Task2/

      - name: Run Linter
        run: npm run lint
        if: always()

      - name: Check Formatting
        run: npx prettier --check .
        if: always()

      - name: Run Tests
        run: npm run test
        if: always()